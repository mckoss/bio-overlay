<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bio-overlay live</title>
  <link rel="stylesheet" href="./overlay/overlay.css" />
  <link rel="stylesheet" href="live.css" />
</head>
<body>
  <!--
    Camera + overlay compositing page: your webcam with the live HR overlay
    drawn on top. Share THIS TAB in Zoom (tick "Optimize for video clip")
    instead of running OBS. See web/README.md.
  -->
  <video id="camera" autoplay playsinline muted></video>
  <div id="camera-off">camera off</div>

  <!-- Overlay host elements, styled by ./overlay/overlay.css -->
  <div id="panels" class="panels"></div>
  <div id="session-clock" class="session-clock"></div>

  <!-- Control bar: auto-hides when the mouse leaves / goes idle so it never
       shows up in the shared tab during a session. -->
  <div id="bar">
    <button id="connect">Connect strap…</button>
    <button id="camera-btn" class="secondary">Start camera</button>
    <button id="mirror-btn" class="secondary">Mirror</button>
    <button id="new-session" class="secondary">New session</button>
    <a class="linkbtn" href="history.html" target="_blank" rel="noopener">History</a>
    <a class="linkbtn" href="about.html">About</a>
    <span id="straps"></span>
    <span id="notice"></span>
  </div>

  <!-- Inline strap profile editor: opens when a new strap connects, or when
       a strap chip is clicked. Persists to localStorage. -->
  <div id="profile-editor" class="hidden">
    <div class="pe-title">Strap <span id="pe-device"></span></div>
    <label>Name
      <input id="pe-name" type="text" autocomplete="off" />
    </label>
    <label>Birth year <span class="pe-hint">(for zones; blank assumes age 65)</span>
      <input id="pe-by" type="number" min="1900" max="2026" placeholder="e.g. 1960" />
    </label>
    <div class="pe-actions">
      <button id="pe-save">Save</button>
      <button id="pe-cancel" class="secondary">Cancel</button>
    </div>
  </div>

  <script type="module" src="live.js"></script>
</body>
</html>
