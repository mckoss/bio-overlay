<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bio-overlay · history</title>
    <link rel="stylesheet" href="overlay/history.css" />
    <link rel="stylesheet" href="session.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>bio-overlay history</h1>
        <p class="nav"><a href="/config">← Setup</a></p>
      </header>

      <!-- Whether the app is recording right now, and the controls to change
           that — so browsing history doesn't mean leaving a session running. -->
      <div id="session-strip" class="session-strip" hidden>
        <span class="state"><span class="dot"></span><span id="session-state"></span></span>
        <span id="session-since" class="since"></span>
        <div id="session-controls" class="session-controls"></div>
      </div>

      <section id="list-view">
        <h2>Past sessions</h2>
        <div id="sessions" class="sessions"></div>
      </section>

      <section id="detail-view" hidden>
        <button id="back" class="btn">← All sessions</button>
        <div id="detail"></div>
      </section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
