# Deploy the web version to GitHub Pages (https://mckoss.com/bio-overlay/).
#
# The published site is just the static web app: web/ plus the shared overlay
# modules it imports (overlay/*.js, *.css) — laid out with the same relative
# structure the pages expect (web/ imports ../overlay/...). The repo's Python
# sources, tests, and docs are not published.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "overlay/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run web tests
        run: node --test web/test/*.test.mjs

      - name: Assemble site
        run: |
          # web/ is lifted to the site root: the live page IS the site
          # (https://mckoss.com/bio-overlay/), history at /history.html.
          # web/ is fully self-contained (the shared modules live in
          # web/overlay/, which the desktop app also serves), so this is a
          # plain copy — no symlinks, no rewriting.
          cp -R web/. _site/
          rm -rf _site/test _site/README.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Execute the deployed page for real (modules, hub, renderer) — a curl
      # for 200s can't catch a broken import graph, which leaves the page
      # looking fine with every button inert.
      - name: Smoke-test deployed site
        run: |
          URL="${{ steps.deployment.outputs.page_url }}?sim=2"
          echo "Smoke-testing $URL"
          google-chrome --headless --disable-gpu --no-sandbox \
            --virtual-time-budget=8000 --enable-logging=stderr \
            --dump-dom "$URL" >dom.html 2>console.log || true
          if grep -iE "uncaught|failed to resolve module" console.log; then
            echo "::error::JS errors on deployed page"; exit 1
          fi
          if ! grep -q 'class="panel' dom.html; then
            echo "::error::overlay panels did not render (sim mode)"; exit 1
          fi
          echo "smoke test passed: panels rendered, console clean"
