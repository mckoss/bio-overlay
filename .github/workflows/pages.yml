# Deploy the web version to GitHub Pages (https://mckoss.com/bio-overlay/).
#
# The published site is just the static web app: web/ plus the shared overlay
# modules it imports (overlay/*.js, *.css) — laid out with the same relative
# structure the pages expect (web/ imports ../overlay/...). The repo's Python
# sources, tests, and docs are not published.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "overlay/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run web tests
        run: node --test web/test/*.test.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/overlay
          # web/ is lifted to the site root: the live page IS the site
          # (https://mckoss.com/bio-overlay/), history at /history.html.
          cp -R web/. _site/
          rm -rf _site/test _site/README.md
          # Only the shared modules/styles the web pages import — not the
          # desktop-only pages (index/config/history HTML need the server).
          cp overlay/*.js overlay/*.css _site/overlay/
          # In the repo the pages live under web/ and import ../overlay/…;
          # at the site root that copy lives at overlay/ — rewrite the
          # relative references to match.
          sed -i 's|\.\./overlay/|overlay/|g' _site/*.html _site/*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
